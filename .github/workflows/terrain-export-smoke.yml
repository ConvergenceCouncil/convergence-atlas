name: Terrain DEM export smoke test
on:
  push:
    paths:
      - 'scripts/export_terrarium_dem.py'
      - 'scripts/dem_to_ue5.py'
      - 'scripts/dem_to_ue5_metric.py'
      - '.github/workflows/terrain-export-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seattle-dem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-terrain.txt'
      - name: Install terrain dependencies
        run: pip install -r requirements-terrain.txt
      - name: Export bounded Seattle DEM
        run: python scripts/export_terrarium_dem.py --bbox -122.45 47.50 -122.20 47.72 --zoom 10 --output output/seattle-dem.tif
      - name: Validate raster and manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, rasterio, numpy as np
          path=pathlib.Path('output/seattle-dem.tif')
          manifest=json.loads(path.with_suffix('.manifest.json').read_text())
          with rasterio.open(path) as ds:
              values=ds.read(1)
              assert ds.crs.to_epsg()==4326, ds.crs
              assert ds.count==1 and ds.width==512 and ds.height==512
              assert np.isfinite(values).all(), 'nonfinite DEM pixels'
              assert -12000 <= float(values.min()) <= 9000, f'unexpected minimum: {values.min()}'
              assert -12000 <= float(values.max()) <= 9000, f'unexpected maximum: {values.max()}'
              print('DEM bounds:', ds.bounds, 'dimensions:', ds.width, ds.height)
              print('Elevation range:', float(values.min()), float(values.max()))
          assert manifest['tile_count'] <= 64
          assert manifest['output_sha256']==hashlib.sha256(path.read_bytes()).hexdigest()
          print('DEM validation passed')
          PY
      - name: Export UE5 landscape heightmap
        run: python scripts/dem_to_ue5.py --input output/seattle-dem.tif --output output/seattle-ue5.png --size 505
      - name: Validate UE5 heightmap
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          import numpy as np
          from PIL import Image
          path=pathlib.Path('output/seattle-ue5.png')
          with Image.open(path) as img:
              arr=np.asarray(img)
              assert img.size==(505,505), img.size
              assert arr.dtype==np.uint16, arr.dtype
              assert arr.max()>arr.min(), 'flat heightmap'
          meta=json.loads(path.with_suffix('.json').read_text())
          assert meta['png_sha256']==hashlib.sha256(path.read_bytes()).hexdigest()
          assert meta['unreal_z_scale_percent']>0
          print('UE5 16-bit PNG validated; Z scale:',meta['unreal_z_scale_percent'])
          PY
      - name: Export metric-projected UE5 heightmap
        run: python scripts/dem_to_ue5_metric.py --input output/seattle-dem.tif --output output/seattle-metric-ue5.png --epsg 32610 --size 505
      - name: Validate metric scale metadata
        run: |
          python - <<'PY'
          import json,pathlib,numpy as np
          from PIL import Image
          path=pathlib.Path('output/seattle-metric-ue5.png')
          meta=json.loads(path.with_suffix('.json').read_text())
          with Image.open(path) as im:
              assert im.size==(505,505)
              assert np.asarray(im).dtype==np.uint16
          assert meta['crs']=='EPSG:32610'
          assert meta['unreal_x_scale_percent']>0 and meta['unreal_y_scale_percent']>0
          bounds=meta['metric_bounds_projected'];size=meta['size'][0]
          assert abs(meta['horizontal_meters_per_vertex_x']-(bounds[2]-bounds[0])/(size-1))<1e-7
          assert abs(meta['horizontal_meters_per_vertex_y']-(bounds[3]-bounds[1])/(size-1))<1e-7
          assert abs(meta['unreal_x_scale_percent']-100*meta['horizontal_meters_per_vertex_x'])<1e-7
          assert abs(meta['unreal_y_scale_percent']-100*meta['horizontal_meters_per_vertex_y'])<1e-7
          print('Metric UE5 heightmap passed:',meta['unreal_x_scale_percent'],meta['unreal_y_scale_percent'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seattle-dem-smoke
          path: |
            output/seattle-dem.tif
            output/seattle-dem.manifest.json
            output/seattle-ue5.png
            output/seattle-ue5.json
            output/seattle-metric-ue5.png
            output/seattle-metric-ue5.json
          retention-days: 7
