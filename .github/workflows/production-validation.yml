name: Production register validation
on:
  push:
    paths: ['production/**', 'scripts/validate_production.py', 'tests/test_production.py', '.github/workflows/production-validation.yml']
  pull_request:
    paths: ['production/**', 'scripts/validate_production.py', 'tests/test_production.py', '.github/workflows/production-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test rejection of invalid records
        run: python3 -m unittest discover -s tests -v
      - name: Validate actual public production registers
        run: python3 scripts/validate_production.py
