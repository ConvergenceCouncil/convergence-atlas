name: Knossos Throne Room build
on:
  push:
    paths:
      - '.github/workflows/knossos-throne-room-build.yml'
      - 'tools/optimize_architecture.py'
      - 'tools/audit_architecture.py'
      - 'tools/validate_review_glb.py'
      - 'tools/build_terrain_review.py'
      - 'assets/review/seattle/seattle-center-ue5.*'
      - 'assets/review/knossos/ATTRIBUTION.md'
  workflow_dispatch:
concurrency:
  group: atlas-review-build
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-throne-room:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download official Throne Room GLB with checksum verification
        run: python3 tools/fetch_knossos.py --download "Throne Room" --out downloaded-knossos
      - name: Verify expected Throne Room checksum
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          p=next(pathlib.Path('downloaded-knossos').glob('*.glb'))
          h=hashlib.md5()
          with p.open('rb') as f:
            for block in iter(lambda:f.read(1024*1024),b''):h.update(block)
          expected='d73acfdb906ca7ecda4452936050a57f'
          actual=h.hexdigest()
          print('MD5',actual)
          if actual!=expected:raise SystemExit(f'Checksum mismatch: {actual} != {expected}')
          PY
      - name: Audit source geometry
        run: python3 tools/audit_architecture.py downloaded-knossos/*.glb > knossos-throne-source-audit.json
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil gltfpack
      - name: Build browser review copy
        run: |
          PATH="/usr/bin:/bin:$PATH" blender -b --python-exit-code 1 -P tools/optimize_architecture.py -- downloaded-knossos/*.glb knossos-throne-browser.glb --ratio 1 --texture-max 4096 --image-format JPEG
          python3 tools/audit_architecture.py knossos-throne-browser.glb > knossos-throne-browser-audit.json
      - name: Build iPhone review copy
        run: |
          PATH="/usr/bin:/bin:$PATH" blender -b --python-exit-code 1 -P tools/optimize_architecture.py -- downloaded-knossos/*.glb knossos-throne-iphone.glb --ratio 1 --texture-max 2048 --image-format JPEG
          python3 tools/audit_architecture.py knossos-throne-iphone.glb > knossos-throne-iphone-audit.json
      - name: Build persistent review assets and enforce budgets
        run: |
          mkdir -p assets/review/knossos
          gltfpack -i knossos-throne-iphone.glb -o assets/review/knossos/knossos-throne-review.glb -noq
          python3 tools/audit_architecture.py assets/review/knossos/knossos-throne-review.glb > assets/review/knossos/knossos-throne-audit.json
          python3 tools/validate_review_glb.py assets/review/knossos/knossos-throne-review.glb > assets/review/knossos/build-report.json
          PATH="/usr/bin:/bin:$PATH" blender -b --python-exit-code 1 -P tools/build_terrain_review.py -- assets/review/seattle
          gltfpack -i assets/review/seattle/seattle-center-terrain-review.glb -o assets/review/seattle/seattle-center-terrain-preview.glb -noq
          python3 tools/audit_architecture.py assets/review/seattle/seattle-center-terrain-preview.glb > assets/review/seattle/seattle-center-terrain-audit.json
      - name: Write delivery report
        run: |
          python3 - <<'PY'
          import json,pathlib
          files={
            'source':next(pathlib.Path('downloaded-knossos').glob('*.glb')),
            'browser':pathlib.Path('knossos-throne-browser.glb'),
            'iphone':pathlib.Path('knossos-throne-iphone.glb')
          }
          sizes={k:v.stat().st_size for k,v in files.items()}
          report={
            'source_MB':round(sizes['source']/1e6,1),
            'browser_MB':round(sizes['browser']/1e6,1),
            'iphone_MB':round(sizes['iphone']/1e6,1),
            'browser_reduction_percent':round(100*(1-sizes['browser']/sizes['source']),1),
            'iphone_reduction_percent':round(100*(1-sizes['iphone']/sizes['source']),1),
            'iphone_transfer_target_MB':60,
            'iphone_transfer_pass':sizes['iphone']<=60_000_000,
            'note':'Transfer budget only; not a guarantee of runtime memory, rendering speed, collision or fidelity.'
          }
          pathlib.Path('knossos-throne-build-report.json').write_text(json.dumps(report,indent=2)+'\n')
          summary=(
            '# Knossos Throne Room build\n\n'
            f"Source: {report['source_MB']} MB  \n"
            f"Browser: {report['browser_MB']} MB  \n"
            f"iPhone: {report['iphone_MB']} MB  \n"
            f"iPhone 60 MB transfer target: {'PASS' if report['iphone_transfer_pass'] else 'FAIL'}\n"
          )
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(summary)
          print(json.dumps(report,indent=2))
          PY
      - name: Publish audits and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-throne-room-report
          path: |
            knossos-throne-source-audit.json
            knossos-throne-browser-audit.json
            knossos-throne-iphone-audit.json
            knossos-throne-build-report.json
          retention-days: 30
      - name: Publish browser review GLB
        uses: actions/upload-artifact@v4
        with:
          name: knossos-throne-browser-glb
          path: knossos-throne-browser.glb
          retention-days: 30
      - name: Publish iPhone review GLB
        uses: actions/upload-artifact@v4
        with:
          name: knossos-throne-iphone-glb
          path: knossos-throne-iphone.glb
          retention-days: 30
      - name: Deliver verified atlas assets
        uses: actions/upload-artifact@v4
        with:
          name: atlas-persistent-review-assets
          path: |
            assets/review/knossos/knossos-throne-review.glb
            assets/review/knossos/knossos-throne-audit.json
            assets/review/knossos/build-report.json
            assets/review/seattle/seattle-center-terrain-preview.glb
            assets/review/seattle/seattle-center-terrain-audit.json
          if-no-files-found: error
          retention-days: 30
  publish-review-assets:
    needs: build-throne-room
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: atlas-persistent-review-assets
          path: generated
      - name: Save verified review assets to the atlas
        run: |
          cp generated/knossos/knossos-throne-review.glb assets/review/knossos/
          cp generated/knossos/knossos-throne-audit.json assets/review/knossos/
          cp generated/knossos/build-report.json assets/review/knossos/
          cp generated/seattle/seattle-center-terrain-preview.glb assets/review/seattle/
          cp generated/seattle/seattle-center-terrain-audit.json assets/review/seattle/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/review/knossos/knossos-throne-review.glb assets/review/knossos/knossos-throne-audit.json assets/review/knossos/build-report.json assets/review/seattle/seattle-center-terrain-preview.glb assets/review/seattle/seattle-center-terrain-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Knossos and Seattle review assets"
          git push origin HEAD:main
