name: Knossos asset discovery
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Optional exact filename fragment (e.g. Throne Room); blank = inventory only"
        required: false
        default: ""
        type: string
      download_asset:
        description: "Download selected GLB into an Actions artifact (accessible to users with repository Actions access)"
        required: false
        default: false
        type: boolean
      optimize_preview:
        description: "Generate reduced browser-review and iPhone-review GLBs using Blender"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
jobs:
  inspect-zenodo-record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODEL_NAME: ${{ inputs.model_name || '' }}
      DOWNLOAD_ASSET: ${{ inputs.download_asset || false }}
      OPTIMIZE_PREVIEW: ${{ inputs.optimize_preview || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official record metadata
        run: |
          set -o pipefail
          python3 tools/fetch_knossos.py --list | tee knossos-asset-list.txt
      - name: Require download for preview optimization
        if: env.OPTIMIZE_PREVIEW == 'true' && env.DOWNLOAD_ASSET != 'true'
        run: |
          echo "optimize_preview requires download_asset=true" >&2
          exit 1
      - name: Guard optional asset download
        if: env.DOWNLOAD_ASSET == 'true'
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          name=os.environ["MODEL_NAME"].strip()
          if not name:raise SystemExit("Specify a model_name before enabling download_asset")
          with urllib.request.urlopen("https://zenodo.org/api/records/7752061",timeout=60) as r: record=json.load(r)
          files=[f for f in record.get("files",[]) if name.lower() in f.get("key","").lower()]
          if len(files)!=1:raise SystemExit(f"Expected exactly one match, found {len(files)}")
          size=files[0].get("size",0)
          if size>500_000_000:raise SystemExit(f"File {size/1e6:.1f} MB exceeds 500 MB workflow safety cap")
          print(f"Authorized selected download: {files[0]['key']} ({size/1e6:.1f} MB)")
          PY
      - name: Download selected official GLB with checksum verification
        if: env.DOWNLOAD_ASSET == 'true'
        run: python3 tools/fetch_knossos.py --download "$MODEL_NAME" --out downloaded-knossos
      - name: Inspect selected GLB structure
        if: env.DOWNLOAD_ASSET == 'true'
        run: |
          python3 - <<'PY'
          import glob,subprocess
          paths=glob.glob("downloaded-knossos/*.glb")
          if len(paths)!=1:raise SystemExit("Expected exactly one GLB file")
          with open("knossos-model-audit.json","w") as out:
            subprocess.run(["python3","tools/audit_architecture.py",paths[0]],check=True,stdout=out)
          PY
      - name: Install Blender for optional preview conversion
        if: env.DOWNLOAD_ASSET == 'true' && env.OPTIMIZE_PREVIEW == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Generate browser and iPhone review GLBs
        if: env.DOWNLOAD_ASSET == 'true' && env.OPTIMIZE_PREVIEW == 'true'
        run: |
          python3 - <<'PY'
          import glob,subprocess
          paths=glob.glob("downloaded-knossos/*.glb")
          if len(paths)!=1:raise SystemExit("Expected exactly one downloaded GLB")
          source=paths[0]
          jobs=[
            ("knossos-browser-preview.glb","0.35","2048"),
            ("knossos-iphone-preview.glb","0.18","1024"),
          ]
          for output,ratio,tex in jobs:
            subprocess.run([
              "blender","-b","-P","tools/optimize_architecture.py","--",
              source,output,"--ratio",ratio,"--texture-max",tex
            ],check=True)
            audit=output.replace('.glb','-audit.json')
            with open(audit,"w") as out:
              subprocess.run(["python3","tools/audit_architecture.py",output],check=True,stdout=out)
          PY
      - name: Measure preview sizes against mobile transfer budget
        if: env.DOWNLOAD_ASSET == 'true' && env.OPTIMIZE_PREVIEW == 'true'
        run: |
          python3 - <<'PY'
          import json,pathlib
          original=next(pathlib.Path('downloaded-knossos').glob('*.glb'))
          browser=pathlib.Path('knossos-browser-preview.glb')
          phone=pathlib.Path('knossos-iphone-preview.glb')
          budget=60_000_000
          report={
            'original_bytes':original.stat().st_size,
            'browser_preview_bytes':browser.stat().st_size,
            'iphone_preview_bytes':phone.stat().st_size,
            'browser_reduction_percent':round(100*(1-browser.stat().st_size/original.stat().st_size),1),
            'iphone_reduction_percent':round(100*(1-phone.stat().st_size/original.stat().st_size),1),
            'iphone_transfer_budget_bytes':budget,
            'iphone_transfer_budget_pass':phone.stat().st_size<=budget,
            'note':'60 MB is a review-transfer screening target, not a guarantee of iPhone memory or frame-rate performance.'
          }
          pathlib.Path('knossos-transfer-budget.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Publish metadata and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-research-report
          path: |
            knossos-asset-list.txt
            knossos-model-audit.json
            knossos-browser-preview-audit.json
            knossos-iphone-preview-audit.json
            knossos-transfer-budget.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish downloaded source model for authorized review
        if: env.DOWNLOAD_ASSET == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-source-review-glb
          path: downloaded-knossos/*.glb
          if-no-files-found: error
          retention-days: 7
      - name: Publish browser review GLB
        if: env.DOWNLOAD_ASSET == 'true' && env.OPTIMIZE_PREVIEW == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-browser-review-glb
          path: knossos-browser-preview.glb
          if-no-files-found: error
          retention-days: 7
      - name: Publish iPhone review GLB
        if: env.DOWNLOAD_ASSET == 'true' && env.OPTIMIZE_PREVIEW == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-iphone-review-glb
          path: knossos-iphone-preview.glb
          if-no-files-found: error
          retention-days: 7
