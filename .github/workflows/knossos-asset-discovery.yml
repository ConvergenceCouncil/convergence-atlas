name: Knossos asset discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
jobs:
  inspect-zenodo-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official record metadata
        run: |
          python3 tools/fetch_knossos.py --list | tee knossos-asset-list.txt
      - name: Publish research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knossos-zenodo-asset-list
          path: knossos-asset-list.txt
          if-no-files-found: ignore
          retention-days: 30
