<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CONVERGENCE · Knossos Room Review</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1019;color:#eee9dc;font:14px system-ui}canvas{display:block}#ui{position:absolute;z-index:3;top:10px;left:10px;max-width:min(350px,86vw);max-height:44vh;overflow:auto;background:#101927e8;border:1px solid #88714b;border-radius:10px;padding:9px}button,a.btn{display:inline-block;background:#26364d;color:#fff;border:1px solid #88714b;border-radius:6px;padding:8px;margin:3px;text-decoration:none}#status{white-space:pre-wrap;font-size:11px;margin-top:6px}#pad{position:absolute;z-index:3;right:12px;bottom:18px;display:none;grid-template-columns:repeat(3,52px);gap:7px;touch-action:none}#pad button{height:48px;font-size:22px}#cross{display:none;position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<div id="ui"><b>CONVERGENCE · Knossos Room Review</b><div><button id="open">Open GLB file</button><button id="walk">Walk</button><button id="reset">Reset</button><a class="btn" href="https://github.com/ConvergenceCouncil/convergence-atlas/actions/workflows/knossos-asset-discovery.yml">Build optimized copy</a><a class="btn" href="https://zenodo.org/records/7752061/files/Throne%20Room.glb?download=1">Official source</a></div><div id="status">Use an optimized local .glb when reviewing on iPhone. The official source is ~395 MB; the pipeline now generates separate browser and iPhone review copies. No geometry is preloaded.</div></div>
<input id="file" type="file" accept=".glb,model/gltf-binary" hidden>
<div id="cross">+</div><div id="pad"><span></span><button data-k="w">↑</button><span></span><button data-k="a">←</button><button data-k="s">↓</button><button data-k="d">→</button></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151b23);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.02,20000);camera.position.set(7,5,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x4b5058,2.1));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(12,24,10);scene.add(sun);scene.add(new THREE.GridHelper(80,80,0x76684f,0x38404a));
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const loader=new GLTFLoader(),status=document.getElementById('status'),file=document.getElementById('file');let root=null,colliders=[],walk=false,keys={},yaw=0,pitch=0,last=null,spawn=new THREE.Vector3(0,1.7,0),groundY=0;const ray=new THREE.Raycaster(),eye=1.7;const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
function setStatus(s){status.textContent=s}function clear(){if(root){scene.remove(root);root.traverse(o=>{o.geometry?.dispose?.();if(o.material){for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.dispose?.()}})}root=null;colliders=[]}
function fit(){if(!root)return;const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3()),d=Math.max(sz.x,sz.y,sz.z,4);groundY=b.min.y;camera.position.copy(c).add(new THREE.Vector3(d*.7,d*.4,d*.95));orbit.target.copy(c);orbit.update();spawn.set(c.x,b.min.y+eye,c.z);ray.set(new THREE.Vector3(c.x,b.max.y+2,c.z),new THREE.Vector3(0,-1,0));ray.far=d+10;const h=ray.intersectObjects(colliders,false).find(x=>x.face&&x.face.normal.clone().transformDirection(x.object.matrixWorld).y>.6);if(h)spawn.copy(h.point).add(new THREE.Vector3(0,eye,0))}
function fileTier(bytes){const mb=bytes/1e6;if(mb<=60)return 'iPhone review target';if(mb<=150)return 'heavy browser review';return 'source/heavy asset — optimize before mobile review'}
async function openFile(f){if(!f||!f.name.toLowerCase().endsWith('.glb'))return setStatus('Select a .glb file.');const mb=f.size/1e6,tier=fileTier(f.size);if(isIOS&&mb>150)return setStatus('NOT LOADED: '+f.name+' · '+mb.toFixed(1)+' MB\nThis is too large for the iPhone review path. Use Build optimized copy and choose the knossos-iphone-review-glb artifact.\nTier: '+tier);setWalk(false);setStatus('Loading '+f.name+' · '+mb.toFixed(1)+' MB…\nTier: '+tier);try{const buffer=await f.arrayBuffer();const g=await new Promise((ok,fail)=>loader.parse(buffer,'',ok,fail));clear();root=g.scene;scene.add(root);root.updateMatrixWorld(true);root.traverse(o=>{if(o.isMesh&&o.visible)colliders.push(o)});fit();const box=new THREE.Box3().setFromObject(root),sz=box.getSize(new THREE.Vector3());setStatus('LOADED: '+f.name+'\nFile: '+mb.toFixed(1)+' MB · '+tier+'\nMeshes: '+colliders.length+'\nBounds: '+[sz.x,sz.y,sz.z].map(v=>v.toFixed(2)).join(' × ')+' scene units\nTap Walk to test traversal. Scale, collision, attribution and historical accuracy still require QA.')}catch(e){setStatus('GLB load failed: '+(e.message||e))}}
function setWalk(v){walk=v;orbit.enabled=!v;document.getElementById('pad').style.display=v?'grid':'none';document.getElementById('cross').style.display=v?'block':'none';document.getElementById('walk').textContent=v?'Exit walk':'Walk';if(v){camera.position.copy(spawn);const d=new THREE.Vector3();camera.getWorldDirection(d);yaw=Math.atan2(-d.x,-d.z);pitch=Math.asin(THREE.MathUtils.clamp(d.y,-1,1))}}
document.getElementById('open').onclick=()=>file.click();file.onchange=()=>{openFile(file.files?.[0]);file.value=''};document.getElementById('walk').onclick=()=>setWalk(!walk);document.getElementById('reset').onclick=()=>{setWalk(false);fit()};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')setWalk(false)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});renderer.domElement.onpointerdown=e=>{if(walk)last=[e.clientX,e.clientY]};window.onpointerup=()=>last=null;window.onpointermove=e=>{if(!walk||!last)return;yaw-=(e.clientX-last[0])*.003;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-last[1])*.003,-1.5,1.5);last=[e.clientX,e.clientY]};
let prev=performance.now();function tick(t){requestAnimationFrame(tick);const dt=Math.min(.05,(t-prev)/1000);prev=t;if(walk){camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);const f=Number(keys.w||keys.arrowup)-Number(keys.s||keys.arrowdown),r=Number(keys.d||keys.arrowright)-Number(keys.a||keys.arrowleft);const v=new THREE.Vector3(r,0,-f);if(v.lengthSq()){v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);ray.set(new THREE.Vector3(camera.position.x,camera.position.y-.5,camera.position.z),v);ray.far=.45;if(!ray.intersectObjects(colliders,false).length)camera.position.addScaledVector(v,dt*3)}ray.set(new THREE.Vector3(camera.position.x,camera.position.y+.8,camera.position.z),new THREE.Vector3(0,-1,0));ray.far=3.8;const h=ray.intersectObjects(colliders,false).find(x=>x.face&&x.face.normal.clone().transformDirection(x.object.matrixWorld).y>.55);if(h){const y=h.point.y+eye;if(Math.abs(y-camera.position.y)<.7)camera.position.y=THREE.MathUtils.lerp(camera.position.y,y,Math.min(1,dt*10))}else camera.position.y=Math.max(camera.position.y,groundY+eye)}else orbit.update();renderer.render(scene,camera)}requestAnimationFrame(tick);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
