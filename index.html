<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE Earth Atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;background:#101827;color:#fff;font:15px system-ui}header{padding:12px}nav{display:flex;gap:6px;padding:0 12px 10px}input{flex:1;min-width:0;padding:10px}button{padding:10px}#status{padding:10px;background:#203047}#map{height:calc(100dvh - 190px);min-height:300px;background:#26384b}a{color:#a9d8ff}</style></head><body><header><b>CONVERGENCE · Earth Atlas</b> · <a href="diagnostics.html">Diagnostics</a></header><nav><input id="query" placeholder="Search a city or place"><button id="find">Find</button><button id="seattle">Seattle</button></nav><div id="status">Loading map…</div><div id="map"></div><section id="guild-panel" style="padding:12px;background:#16263b;color:white;font:14px system-ui"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>APPROVED GUILD REGISTRY · 82 SITES</b><button id="guild-toggle" style="padding:7px">Show</button></div><div id="guild-content" style="display:none;margin-top:10px"><input id="guild-filter" placeholder="Filter site, city or Gate status" style="width:100%;padding:9px;box-sizing:border-box"><select id="guild-gates" aria-label="Filter by Gate status" style="width:100%;padding:9px;margin-top:7px"><option value="">All Gate statuses</option><option value="operational">Operational (including restricted)</option><option value="no-gate">No Gate</option><option value="construction">Under Construction</option><option value="proposed">Proposed / Surveyed</option></select><div id="guild-count" style="margin:8px 0"></div><div id="guild-list" style="max-height:240px;overflow:auto"></div><small>Site selection is registry-only until exact coordinates are audited.</small></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(function(){const s=document.getElementById('status');if(typeof L==='undefined'){s.innerHTML='Map library blocked. <a href="diagnostics.html">Run diagnostics</a> or <a href="https://www.openstreetmap.org/#map=13/47.622/-122.354">open Seattle on OpenStreetMap</a>.';return;}try{const m=L.map('map').setView([47.6219,-122.3539],13);window.__convergenceMap=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).on('load',()=>s.textContent='Map ready · Seattle Center').on('tileerror',()=>s.innerHTML='Map tiles unavailable. <a href="diagnostics.html">Run diagnostics</a>.').addTo(m);L.marker([47.6219,-122.3539]).addTo(m).bindPopup('Seattle Center: approximate reference, not audited Guild coordinates');document.getElementById('seattle').onclick=()=>m.setView([47.6219,-122.3539],13);async function search(){const q=document.getElementById('query').value.trim();if(!q)return;s.textContent='Searching…';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error('Service unavailable');const a=await r.json();if(a.length){m.setView([+a[0].lat,+a[0].lon],12);s.textContent=a[0].display_name;}else s.textContent='No place found';}catch(e){s.textContent='Search unavailable: '+e.message;}}document.getElementById('find').onclick=search;document.getElementById('query').onkeydown=e=>{if(e.key==='Enter')search();};}catch(e){s.textContent='Atlas startup error: '+e.message;}})();</script><script>
(function(){
if(typeof L==='undefined')return;
const mapElement=document.getElementById('map');
const info=document.createElement('div');
info.id='reference-status';
info.style.cssText='position:absolute;bottom:24px;left:10px;z-index:999;background:#17283c;color:white;padding:8px 12px;border-radius:8px;max-width:240px;font:12px system-ui;pointer-events:none';
info.textContent='Loading Cascadia reference points…';
mapElement.parentNode.appendChild(info);
fetch('data/cascadia-reference.geojson').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{
if(!data.features||!Array.isArray(data.features))throw Error('Invalid GeoJSON');
const map=L.Map&&Object.values(mapElement._leaflet_id?{}:{}); 
const container=mapElement;
const mapId=container._leaflet_id;
const instances=window.__convergenceMap;
if(!instances){info.textContent='Reference data available · '+data.features.length+' locations. Map overlay awaiting initialization.';return;}
L.geoJSON(data,{pointToLayer:(feature,latlng)=>L.circleMarker(latlng,{radius:6,color:'#ffd166',fillColor:'#ffd166',fillOpacity:.85}),onEachFeature:(feature,layer)=>layer.bindPopup('<b>'+feature.properties.name+'</b><p>Approximate geographic reference; not an audited Guild site.</p>')}).addTo(instances);
info.textContent=data.features.length+' provisional Cascadia references · not verified Guild sites';
}).catch(e=>{info.textContent='Reference layer unavailable: '+e.message});
})();
</script><script>(function(){const toggle=document.getElementById('guild-toggle'),panel=document.getElementById('guild-content'),list=document.getElementById('guild-list'),filter=document.getElementById('guild-filter'),count=document.getElementById('guild-count');let sites=[];toggle.onclick=()=>{const open=panel.style.display==='none';panel.style.display=open?'block':'none';toggle.textContent=open?'Hide':'Show';};function render(){const q=filter.value.trim().toLowerCase(),gate=document.getElementById('guild-gates').value,matches=sites.filter(s=>{const status=s.gate_status.toLowerCase();const gateMatch=!gate||(gate==='operational'&&status.startsWith('operational'))||(gate==='no-gate'&&status.includes('no gate'))||(gate==='construction'&&status.includes('construction'))||(gate==='proposed'&&status.includes('proposed'));return gateMatch&&[s.id,s.location,s.type,s.gate_status].join(' ').toLowerCase().includes(q);});count.textContent=matches.length+' of '+sites.length+' approved sites';list.replaceChildren();for(const s of matches){const row=document.createElement('div');row.style.cssText='border-top:1px solid #425671;padding:8px 0';const strong=document.createElement('b');strong.textContent=s.id+' · '+s.location;const small=document.createElement('div');small.textContent=s.type+' · Gate: '+s.gate_status;const locate=document.createElement('button');locate.textContent='Find city on map';locate.style.cssText='display:block;margin-top:5px;padding:6px;font-size:12px';locate.onclick=()=>{document.getElementById('query').value=s.location.replace(/\s*\/.*$/,'');document.getElementById('find').click();document.getElementById('status').scrollIntoView({behavior:'smooth',block:'start'});};row.append(strong,small,locate);list.append(row);}}filter.addEventListener('input',render);document.getElementById('guild-gates').addEventListener('change',render);fetch('data/approved-guild-registry.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{sites=data.sites||[];render();}).catch(e=>{count.textContent='Guild registry unavailable: '+e.message;});})();</script></body></html>
