<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE Earth Atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;background:#101827;color:#fff;font:15px system-ui}header{padding:12px}nav{display:flex;gap:6px;padding:0 12px 10px}input{flex:1;min-width:0;padding:10px}button{padding:10px}#status{padding:10px;background:#203047}#map{height:calc(100dvh - 130px);min-height:300px;background:#26384b}a{color:#a9d8ff}</style></head><body><header><b>CONVERGENCE · Earth Atlas</b> · <a href="diagnostics.html">Diagnostics</a></header><nav><input id="query" placeholder="Search a city or place"><button id="find">Find</button><button id="seattle">Seattle</button></nav><div id="status">Loading map…</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(function(){const s=document.getElementById('status');if(typeof L==='undefined'){s.innerHTML='Map library blocked. <a href="diagnostics.html">Run diagnostics</a> or <a href="https://www.openstreetmap.org/#map=13/47.622/-122.354">open Seattle on OpenStreetMap</a>.';return;}try{const m=L.map('map').setView([47.6219,-122.3539],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).on('load',()=>s.textContent='Map ready · Seattle Center').on('tileerror',()=>s.innerHTML='Map tiles unavailable. <a href="diagnostics.html">Run diagnostics</a>.').addTo(m);L.marker([47.6219,-122.3539]).addTo(m).bindPopup('Seattle Center: approximate reference, not audited Guild coordinates');document.getElementById('seattle').onclick=()=>m.setView([47.6219,-122.3539],13);async function search(){const q=document.getElementById('query').value.trim();if(!q)return;s.textContent='Searching…';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error('Service unavailable');const a=await r.json();if(a.length){m.setView([+a[0].lat,+a[0].lon],12);s.textContent=a[0].display_name;}else s.textContent='No place found';}catch(e){s.textContent='Search unavailable: '+e.message;}}document.getElementById('find').onclick=search;document.getElementById('query').onkeydown=e=>{if(e.key==='Enter')search();};}catch(e){s.textContent='Atlas startup error: '+e.message;}})();</script></body></html>
