<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE · 3D Earth prototype</title><link href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;font-family:system-ui,sans-serif}#panel{position:absolute;z-index:5;top:12px;left:12px;right:12px;max-width:370px;max-height:45vh;overflow-y:auto;background:rgba(9,21,38,.94);border:1px solid #8a7849;border-radius:12px;padding:12px;color:#eee;box-sizing:border-box}a{color:#e8c782}button{background:#243c54;border:1px solid #a3a6aa;border-radius:6px;padding:8px;color:white}#status{font-size:12px;line-height:1.5;color:#d7e0e9;margin-top:8px}.cesium-viewer-bottom{bottom:3px!important}</style></head>
<body><div id="globe"></div><div id="panel"><strong>CONVERGENCE · 3D Earth prototype</strong><div style="font-size:13px;margin:6px 0">Real-world globe with native quantized-mesh terrain. The original <a href="index.html">2D Earth Atlas</a> · <a href="terrain.html">Cascadia 3D terrain</a> remains unchanged.</div><div style="margin:7px 0"><select id="destinations" style="width:100%;padding:9px;background:#20364c;color:#fff;border:1px solid #a3a6aa;border-radius:6px"><option value="">Choose a Guild Hall or Wonder…</option></select> <button id="inspect" style="margin-top:6px">Inspect location</button></div><button id="terrain">Enable 3D terrain</button> <button id="orbit">Orbit selected site</button> <button id="buildings">Load nearby 3D buildings</button> <button id="global-buildings">Enable global 3D buildings</button> <button id="imagery">Imagery: World</button><div style="margin-top:6px"><button data-fly="-122.3321,47.6062,25000">Seattle</button> <button data-fly="-121.7603,46.8523,24000">Rainier</button> <button data-fly="-123.5,47.8,45000">Olympics</button> <button data-fly="-122.33,47.61,12500000">Whole Earth</button></div><div id="status">Loading globe…</div></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Cesium.js"></script><script>
(async function(){'use strict';const status=document.getElementById('status');if(typeof Cesium==='undefined'){status.textContent='3D engine could not load. Use the 2D Atlas.';return;}try{
const viewer=new Cesium.Viewer('globe',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:false,fullscreenButton:false,infoBox:true,selectionIndicator:true,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:false});
viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#28516b');
viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-122.33,47.61,12500000)});
try{const imagery=new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri, Vantor, Earthstar Geographics and the GIS User Community',maximumLevel:19});viewer.imageryLayers.addImageryProvider(imagery);}catch(e){console.warn('Imagery unavailable:',e);}
status.textContent='3D globe ready. Elevation loads automatically; choose Rainier or Seattle.';
try{const resource=await fetch('data/earth/ne110-countries.geojson');if(!resource.ok)throw Error('HTTP '+resource.status);const data=await resource.json();const ds=await Cesium.GeoJsonDataSource.load(data,{stroke:Cesium.Color.fromCssColorString('#d6bc78'),strokeWidth:1,fill:Cesium.Color.fromCssColorString('#16354c').withAlpha(.08),clampToGround:false});viewer.dataSources.add(ds);status.textContent='3D globe with Natural Earth country boundaries. Tap Enable 3D terrain to load elevation.';}catch(e){status.textContent='Globe loaded; country overlay unavailable: '+e.message;}
let terrainEnabled=false;
const terrainButton=document.getElementById('terrain');
// Native quantized-mesh terrain replaces the experimental raster heightmap mesh.
let terrainProvider=null;
try{
 terrainProvider=await Cesium.CesiumTerrainProvider.fromUrl('https://terrain.reearth.land/cesium-mesh/ellipsoid',{requestVertexNormals:true,requestWaterMask:true});
 status.textContent='Native quantized-mesh terrain provider connected (Re:Earth / Mapterhorn).';
}catch(e){status.textContent='Native terrain unavailable: '+e.message+'. Smooth globe fallback.';}
// Stream tiled Overture buildings worldwide, without an account token.
let globalBuildings=null;
const buildingCredits=document.createElement('div');buildingCredits.style.cssText='font-size:10px;color:#b9c6d0;margin-top:5px';buildingCredits.textContent='Buildings © OpenStreetMap contributors, Overture Maps Foundation (ODbL). Terrain © Re:Earth Terrain / Mapterhorn.';document.getElementById('panel').appendChild(buildingCredits);
const globalBuildingsButton=document.getElementById('global-buildings');
globalBuildingsButton.onclick=async()=>{
 if(globalBuildings){viewer.scene.primitives.remove(globalBuildings);globalBuildings=null;globalBuildingsButton.textContent='Enable global 3D buildings';status.textContent='Global building tiles hidden.';return;}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;document.getElementById('buildings').textContent='Load nearby 3D buildings';}
 globalBuildingsButton.disabled=true;status.textContent='Connecting to worldwide 3D building tiles…';
 try{
  const tileset=await Cesium.Cesium3DTileset.fromUrl('https://buildings.reearth.land/tileset.json',{maximumScreenSpaceError:16,dynamicScreenSpaceError:true,skipLevelOfDetail:true});
  viewer.scene.primitives.add(tileset);globalBuildings=tileset;
  tileset.tileFailed.addEventListener(e=>console.warn('3D building tile failed',e));
  globalBuildingsButton.textContent='Hide global 3D buildings';
  status.textContent='Worldwide Overture building geometry enabled. Zoom into a city; building tiles stream as needed. Detailed landmark models remain separate.';
 }catch(e){status.textContent='Global 3D building tiles unavailable: '+e.message+'. Nearby OSM extrusions remain available.';}
 finally{globalBuildingsButton.disabled=false;}
};
// OSM building footprints extruded into actual 3D polygon geometry; limited downtown pilot.
let buildingCollection=null;let orbitHandler=null;let currentTarget={lat:47.604,lon:-122.334,name:'Downtown Seattle'};
document.getElementById('buildings').onclick=async()=>{
 const button=document.getElementById('buildings');
 if(globalBuildings){status.textContent='Global building tiles are already active. Disable them before loading the local OSM layer to avoid duplicate buildings.';return;}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;button.textContent='Load nearby 3D buildings';status.textContent='Nearby buildings hidden.';return;}
 button.disabled=true;status.textContent='Fetching OpenStreetMap building footprints near '+currentTarget.name+'…';
 try{
  const {lat,lon}=currentTarget;const delta=.006;const bbox=[lat-delta,lon-delta,lat+delta,lon+delta].join(',');const q='[out:json][timeout:25];way["building"]('+bbox+');out geom;';
  let response;let lastError;
  for(const endpoint of ['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass-api.de/api/interpreter']){
   try{const candidate=await fetch(endpoint+'?data='+encodeURIComponent(q),{signal:AbortSignal.timeout(18000)});if(candidate.ok){response=candidate;break;}lastError=Error('HTTP '+candidate.status);}catch(e){lastError=e;}
  }
  if(!response)throw lastError||Error('All building services unavailable');
  if(!response.ok)throw Error('OpenStreetMap building service HTTP '+response.status);
  const data=await response.json();
  const features=[];
  for(const el of data.elements||[]){
   if(!el.geometry||el.geometry.length<4)continue;
   const coords=el.geometry.map(p=>[p.lon,p.lat]);
   if(coords[0][0]!==coords[coords.length-1][0]||coords[0][1]!==coords[coords.length-1][1])coords.push(coords[0]);
   const tags=el.tags||{};
   const heightText=String(tags.height||'').replace(/[^0-9.]/g,'');
   const height=heightText?Number(heightText):(Math.max(1,Number(tags['building:levels'])||3)*3.2);
   features.push({type:'Feature',properties:{name:tags.name||'Building',height:Math.min(450,Math.max(3,height)),osm_id:el.id},geometry:{type:'Polygon',coordinates:[coords]}});
  }
  const fc={type:'FeatureCollection',features};
  buildingCollection=await Cesium.GeoJsonDataSource.load(fc,{clampToGround:false});
  for(const entity of buildingCollection.entities.values){
   if(!entity.polygon)continue;
   const props=entity.properties;
   const height=props.height.getValue();
   entity.polygon.height=0;
   entity.polygon.heightReference=Cesium.HeightReference.RELATIVE_TO_GROUND;
   entity.polygon.extrudedHeight=height;
   entity.polygon.extrudedHeightReference=Cesium.HeightReference.RELATIVE_TO_GROUND;
   entity.polygon.material=Cesium.Color.fromCssColorString('#9aa7b3').withAlpha(.94);
   entity.polygon.outline=false;
   entity.polygon.shadows=Cesium.ShadowMode.DISABLED;
  }
  viewer.dataSources.add(buildingCollection);
  button.textContent='Hide nearby 3D buildings';
  status.textContent=features.length+' building footprints near '+currentTarget.name+' extruded relative to ground. Height estimates used where missing; geometry is schematic, not photogrammetry.';
  viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,2600),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:1.8});
 }catch(e){status.textContent='Building data unavailable: '+e.message+'. Try again later.';}
 finally{button.disabled=false;}
};
// Shared Atlas registry: Guild Hall/Outpost reference points and New Seven Wonders.
document.getElementById('orbit').onclick=async()=>{
 const button=document.getElementById('orbit');
 if(orbitHandler){viewer.clock.onTick.removeEventListener(orbitHandler);orbitHandler=null;button.textContent='Orbit selected site';status.textContent='Orbit stopped.';return;}
 const target=Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,0);
 try{
  const sample=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[Cesium.Cartographic.fromDegrees(currentTarget.lon,currentTarget.lat)]);
  const height=Number.isFinite(sample[0]?.height)?sample[0].height:0;
  const center=Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,height);
  viewer.camera.lookAt(center,new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-30),Math.max(450,currentTarget.type==='wonder'?1400:850)));
  let last=Date.now();
  orbitHandler=()=>{const now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;viewer.camera.rotateRight(dt*.08);};
  viewer.clock.onTick.addEventListener(orbitHandler);button.textContent='Stop orbit';
  status.textContent='Orbiting '+currentTarget.name+'. Buildings are OSM extrusions; detailed Guild architecture is not yet modeled.';
 }catch(e){status.textContent='Unable to start orbit: '+e.message;}
};
const destinationSelect=document.getElementById('destinations');
const destinations=[];
try{
 const [guildRes,wonderRes]=await Promise.all([fetch('data/approved-guild-registry.json'),fetch('data/modern-seven-wonders.geojson')]);
 if(!guildRes.ok||!wonderRes.ok)throw Error('Atlas registry unavailable');
 const guildData=await guildRes.json(),wonderData=await wonderRes.json();
 for(const site of guildData.sites||[]){const p=site.map_reference;if(p&&Number.isFinite(p.latitude)&&Number.isFinite(p.longitude))destinations.push({id:site.id,name:site.id+' · '+site.location,lat:p.latitude,lon:p.longitude,type:'guild',note:'Approximate site reference; approved building placement not surveyed'});}
 for(const feature of wonderData.features||[]){const c=feature.geometry?.coordinates;if(c?.length>=2)destinations.push({id:feature.properties.id,name:feature.properties.name,lat:c[1],lon:c[0],type:'wonder',note:feature.properties.note||'Landmark reference point'});}
 for(const type of ['guild','wonder']){const group=document.createElement('optgroup');group.label=type==='guild'?'Guild Halls and Outposts':'Seven Wonders';for(const d of destinations.filter(d=>d.type===type)){const o=document.createElement('option');o.value=d.id;o.textContent=d.name;group.appendChild(o);}destinationSelect.appendChild(group);}
 const markers=viewer.entities;
 for(const d of destinations){markers.add({name:d.name,position:Cesium.Cartesian3.fromDegrees(d.lon,d.lat,0),point:{pixelSize:d.type==='wonder'?10:7,color:d.type==='wonder'?Cesium.Color.GOLD:Cesium.Color.CYAN,outlineColor:Cesium.Color.BLACK,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:300000},label:{text:d.type==='wonder'?d.name:'',font:'12px sans-serif',fillColor:Cesium.Color.WHITE,pixelOffset:new Cesium.Cartesian2(0,-16),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,150000)}});}
 status.textContent='Atlas destinations ready: '+destinations.length+' Guild/Wonder reference points. Choose one to inspect.';
}catch(e){status.textContent='Destination registry failed: '+e.message;}
document.getElementById('inspect').onclick=()=>{
 const d=destinations.find(x=>x.id===destinationSelect.value);if(!d){status.textContent='Choose a destination first.';return;}
 currentTarget=d;
 if(orbitHandler){viewer.clock.onTick.removeEventListener(orbitHandler);orbitHandler=null;document.getElementById('orbit').textContent='Orbit selected site';viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;document.getElementById('buildings').textContent='Load nearby 3D buildings';}
 viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(d.lon,d.lat,d.type==='wonder'?5000:2200),orientation:{heading:0,pitch:Cesium.Math.toRadians(-48),roll:0},duration:2});
 status.textContent=d.name+' · '+d.note+'. Use Load nearby 3D buildings for schematic OSM extrusions. Canon Guild Hall architecture is not modeled yet.';
};
const imageryButton=document.getElementById('imagery');
let usgsImagery=false;
imageryButton.onclick=()=>{
 usgsImagery=!usgsImagery;
 const url=usgsImagery?'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}':'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
 try{viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url,maximumLevel:19,credit:usgsImagery?'USGS National Map imagery (US coverage only)':'Esri and imagery contributors'}));imageryButton.textContent=usgsImagery?'Imagery: USGS USA':'Imagery: World';status.textContent=usgsImagery?'USGS aerial imagery enabled. Switch to World outside US coverage.':'Worldwide imagery enabled.';}catch(e){status.textContent='Imagery switch failed: '+e.message;}
};
document.querySelectorAll('[data-fly]').forEach(button=>button.onclick=()=>{const [lon,lat,alt]=button.dataset.fly.split(',').map(Number);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,alt),orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0},duration:1.8});});
terrainButton.onclick=()=>{
 terrainEnabled=!terrainEnabled;
 viewer.terrainProvider=terrainEnabled&&terrainProvider?terrainProvider:new Cesium.EllipsoidTerrainProvider();
 terrainButton.textContent=terrainEnabled?'Disable 3D terrain':'Enable 3D terrain';
 status.textContent=terrainEnabled?(terrainProvider?'Native quantized-mesh terrain enabled. Zoom toward Seattle or Rainier.':'Terrain provider unavailable; smooth globe fallback.'):'Smooth globe restored.';
};
if(terrainProvider)terrainButton.click();
// Default to real 3D city geometry: users should not need to discover an extra switch.
globalBuildingsButton.click();
// Tap a 3D building to inspect its Overture metadata where present.
const picking=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
picking.setInputAction(event=>{
 const picked=viewer.scene.pick(event.position);
 if(!Cesium.defined(picked)||typeof picked.getProperty!=='function')return;
 const read=k=>{try{return picked.getProperty(k);}catch(e){return undefined;}};
 const name=read('name')||'3D building',height=read('height'),method=read('height_method'),floors=read('num_floors');
 status.textContent=name+(Number.isFinite(Number(height))?' · '+Number(height).toFixed(1)+' m high':'')+(floors?' · '+floors+' floors':'')+(method?' · height source: '+method:'')+'. Source: Overture Maps; heights may be estimated.';
},Cesium.ScreenSpaceEventType.LEFT_CLICK);

}catch(e){status.textContent='Unable to initialize 3D globe: '+e.message;}})();
</script></body></html>
