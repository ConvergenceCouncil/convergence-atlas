<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE · 3D Earth prototype</title><link href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;font-family:system-ui,sans-serif}#panel{position:absolute;z-index:5;top:12px;left:12px;right:12px;max-width:370px;background:rgba(9,21,38,.94);border:1px solid #8a7849;border-radius:12px;padding:12px;color:#eee;box-sizing:border-box}a{color:#e8c782}button{background:#243c54;border:1px solid #a3a6aa;border-radius:6px;padding:8px;color:white}#status{font-size:12px;line-height:1.5;color:#d7e0e9;margin-top:8px}.cesium-viewer-bottom{bottom:3px!important}</style></head>
<body><div id="globe"></div><div id="panel"><strong>CONVERGENCE · 3D Earth prototype</strong><div style="font-size:13px;margin:6px 0">Real-world globe reference. The original <a href="index.html">2D Earth Atlas</a> · <a href="terrain.html">Cascadia 3D terrain</a> remains unchanged.</div><button id="terrain">Enable 3D terrain</button> <button id="imagery">Imagery: World</button><div style="margin-top:6px"><button data-fly="-122.3321,47.6062,25000">Seattle</button> <button data-fly="-121.7603,46.8523,24000">Rainier</button> <button data-fly="-123.5,47.8,45000">Olympics</button> <button data-fly="-122.33,47.61,12500000">Whole Earth</button></div><div id="status">Loading globe…</div></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Cesium.js"></script><script>
(async function(){'use strict';const status=document.getElementById('status');if(typeof Cesium==='undefined'){status.textContent='3D engine could not load. Use the 2D Atlas.';return;}try{
const viewer=new Cesium.Viewer('globe',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:false,fullscreenButton:false,infoBox:true,selectionIndicator:true,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:false});
viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#28516b');
viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-122.33,47.61,12500000)});
try{const imagery=new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri, Vantor, Earthstar Geographics and the GIS User Community',maximumLevel:19});viewer.imageryLayers.addImageryProvider(imagery);}catch(e){console.warn('Imagery unavailable:',e);}
status.textContent='3D globe ready. Elevation loads automatically; choose Rainier or Seattle.';
try{const resource=await fetch('data/earth/ne110-countries.geojson');if(!resource.ok)throw Error('HTTP '+resource.status);const data=await resource.json();const ds=await Cesium.GeoJsonDataSource.load(data,{stroke:Cesium.Color.fromCssColorString('#d6bc78'),strokeWidth:1,fill:Cesium.Color.fromCssColorString('#16354c').withAlpha(.08),clampToGround:false});viewer.dataSources.add(ds);status.textContent='3D globe with Natural Earth country boundaries. Tap Enable 3D terrain to load elevation.';}catch(e){status.textContent='Globe loaded; country overlay unavailable: '+e.message;}
let terrainEnabled=false;
const terrainButton=document.getElementById('terrain');
const scheme=new Cesium.WebMercatorTilingScheme();let good=0,bad=0;const tileCache=new Map();
const terrainProvider=new Cesium.CustomHeightmapTerrainProvider({
 tilingScheme:scheme,width:65,height:65,
 callback:async(x,y,level)=>{
  // Terrarium tiles share Web Mercator x/y/zoom indexing with this tiling scheme.
  // Limit the DEM sampling level to reduce mobile network and decoding costs.
  const zoom=Math.min(level,14),shift=level-zoom,tx=Math.floor(x/Math.pow(2,shift)),ty=Math.floor(y/Math.pow(2,shift));
  const url='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/'+zoom+'/'+tx+'/'+ty+'.png';
  try{
   let job=tileCache.get(url);if(!job){job=(async()=>{const response=await fetch(url,{mode:'cors'});if(!response.ok)throw Error('HTTP '+response.status);const bitmap=await createImageBitmap(await response.blob());const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,256,256);if(bitmap.close)bitmap.close();return ctx.getImageData(0,0,256,256).data;})();tileCache.set(url,job);if(tileCache.size>100)tileCache.delete(tileCache.keys().next().value);}
   const rgba=await job;
   const heights=new Float32Array(65*65);
   const tilesAcross=Math.pow(2,level-zoom);
   const localX=(x-tx*tilesAcross)/tilesAcross;
   const localY=(y-ty*tilesAcross)/tilesAcross;
   // Cesium HeightmapTerrainData requires NORTH-to-SOUTH rows, matching Terrarium PNGs.
   // Bilinear interpolation prevents the nearest-neighbor elevation stair steps.
   function sample(u,v){
    const fx=Math.max(0,Math.min(255,(localX+u/tilesAcross)*256-0.5));
    const fy=Math.max(0,Math.min(255,(localY+v/tilesAcross)*256-0.5));
    const x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(255,x0+1),y1=Math.min(255,y0+1);
    const dx=fx-x0,dy=fy-y0;
    const h=(xx,yy)=>{const i=(yy*256+xx)*4;return rgba[i]*256+rgba[i+1]+rgba[i+2]/256-32768;};
    return (h(x0,y0)*(1-dx)+h(x1,y0)*dx)*(1-dy)+(h(x0,y1)*(1-dx)+h(x1,y1)*dx)*dy;
   }
   for(let row=0;row<65;row++)for(let col=0;col<65;col++){
    heights[row*65+col]=sample(col/64,row/64);
   }
   good++;if(good===1||good%25===0)status.textContent='3D elevation tiles loaded: '+good+'; errors: '+bad+'.';return heights;
  }catch(err){bad++;console.warn('Terrain tile unavailable',url,err);status.textContent='Terrain load errors: '+bad+' ('+String(err.message||err)+'). Globe may appear flat.';return new Float32Array(65*65);}
 }
});
const imageryButton=document.getElementById('imagery');
let usgsImagery=false;
imageryButton.onclick=()=>{
 usgsImagery=!usgsImagery;
 const url=usgsImagery?'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}':'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
 try{viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url,maximumLevel:19,credit:usgsImagery?'USGS National Map imagery (US coverage only)':'Esri and imagery contributors'}));imageryButton.textContent=usgsImagery?'Imagery: USGS USA':'Imagery: World';status.textContent=usgsImagery?'USGS aerial imagery enabled. Switch to World outside US coverage.':'Worldwide imagery enabled.';}catch(e){status.textContent='Imagery switch failed: '+e.message;}
};
document.querySelectorAll('[data-fly]').forEach(button=>button.onclick=()=>{const [lon,lat,alt]=button.dataset.fly.split(',').map(Number);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,alt),orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0},duration:1.8});});
terrainButton.onclick=()=>{
 terrainEnabled=!terrainEnabled;
 viewer.terrainProvider=terrainEnabled?terrainProvider:new Cesium.EllipsoidTerrainProvider();
 terrainButton.textContent=terrainEnabled?'Disable 3D terrain':'Enable 3D terrain';
 status.textContent=terrainEnabled?'Terrain enabled; waiting for elevation tiles. Zoom toward Rainier.':'Smooth globe restored.';
};
terrainButton.click();

}catch(e){status.textContent='Unable to initialize 3D globe: '+e.message;}})();
</script></body></html>
