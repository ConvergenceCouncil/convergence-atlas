<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE · 3D Earth prototype</title><link href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;font-family:system-ui,sans-serif}#panel.collapsed{max-height:none;width:auto;max-width:calc(100vw - 24px);padding:6px 9px;background:rgba(9,21,38,.72);border-color:rgba(181,160,102,.6)}#panel.collapsed #panel-content{display:none}#panel.collapsed #panel-toggle{margin:0}#panel-toggle{font-weight:600;cursor:pointer}#panel-content{margin-top:8px}#panel{position:absolute;z-index:5;top:12px;left:12px;right:12px;max-width:370px;max-height:45vh;overflow-y:auto;background:rgba(9,21,38,.94);border:1px solid #8a7849;border-radius:12px;padding:12px;color:#eee;box-sizing:border-box}a{color:#e8c782}button{background:#243c54;border:1px solid #a3a6aa;border-radius:6px;padding:8px;color:white}#status{font-size:12px;line-height:1.5;color:#d7e0e9;margin-top:8px}.cesium-viewer-bottom{bottom:3px!important}</style></head>
<body><div id="globe"></div><div id="panel" class="collapsed"><button id="panel-toggle" aria-expanded="false">☰ Explore locations</button><div id="panel-content"><div style="margin:5px 0"><select id="destinations" style="width:100%;padding:9px;background:#20364c;color:#fff;border:1px solid #a3a6aa;border-radius:6px"><option value="">Choose a Guild Hall or Wonder…</option></select><button id="inspect" style="margin-top:6px">Go to location</button></div><div id="status">Loading globe…</div><div style="font-size:11px;margin-top:8px"><a href="index.html">2D Atlas</a> · <a href="terrain.html">Regional terrain</a></div></div></div>
<div id="engine-controls" hidden><button id="terrain">Terrain</button><button id="orbit">Orbit</button><button id="buildings">Local buildings</button><button id="global-buildings">Global buildings</button><button id="needle-model">Space Needle</button><button id="landmark-models">Wonders</button><button id="imagery">Imagery</button><button id="quality">Quality</button><div id="lod-status"></div><div id="imagery-detail"></div><button data-inspect-height="4500">Aerial</button><button data-inspect-height="800">Building</button><button data-inspect-height="90">Ground</button><button data-fly="-122.3321,47.6062,25000">Seattle</button></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Cesium.js"></script><script>
(async function(){'use strict';document.getElementById('panel-toggle').onclick=()=>{const panel=document.getElementById('panel');const collapsed=panel.classList.toggle('collapsed');document.getElementById('panel-toggle').setAttribute('aria-expanded',String(!collapsed));};const status=document.getElementById('status');if(typeof Cesium==='undefined'){status.textContent='3D engine could not load. Use the 2D Atlas.';return;}try{
const viewer=new Cesium.Viewer('globe',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:false,fullscreenButton:false,infoBox:true,selectionIndicator:true,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:false});
viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#28516b');
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
let quality='balanced';
function applyQuality(mode){
 quality=mode;
 const detailed=mode==='high';
 viewer.resolutionScale=detailed?Math.min(window.devicePixelRatio||1,mobile?1.5:2):1;
 viewer.scene.fxaa=true;
 viewer.scene.globe.maximumScreenSpaceError=detailed?1.5:3;
 viewer.scene.globe.tileCacheSize=detailed?180:90;
 viewer.scene.globe.preloadAncestors=true;
 viewer.scene.globe.preloadSiblings=detailed;
 viewer.scene.globe.depthTestAgainstTerrain=true;
 viewer.scene.globe.enableLighting=false;
 if(globalBuildings){globalBuildings.maximumScreenSpaceError=detailed?8:16;}
 document.getElementById('quality').textContent=detailed?'Quality: High':'Quality: Balanced';
 currentLod='';updateZoomLod();
}

viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-122.33,47.61,12500000)});
try{const imagery=new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri, Vantor, Earthstar Geographics and the GIS User Community',maximumLevel:19});viewer.imageryLayers.addImageryProvider(imagery);}catch(e){console.warn('Imagery unavailable:',e);}
status.textContent='3D globe ready. Elevation loads automatically; choose Rainier or Seattle.';
try{const resource=await fetch('data/earth/ne110-countries.geojson');if(!resource.ok)throw Error('HTTP '+resource.status);const data=await resource.json();const ds=await Cesium.GeoJsonDataSource.load(data,{stroke:Cesium.Color.fromCssColorString('#d6bc78'),strokeWidth:1,fill:Cesium.Color.fromCssColorString('#16354c').withAlpha(.08),clampToGround:false});viewer.dataSources.add(ds);status.textContent='3D globe with Natural Earth country boundaries. Tap Enable 3D terrain to load elevation.';}catch(e){status.textContent='Globe loaded; country overlay unavailable: '+e.message;}
let terrainEnabled=false;
const terrainButton=document.getElementById('terrain');
// Native quantized-mesh terrain replaces the experimental raster heightmap mesh.
let terrainProvider=null;
try{
 terrainProvider=await Cesium.CesiumTerrainProvider.fromUrl('https://terrain.reearth.land/cesium-mesh/ellipsoid',{requestVertexNormals:true,requestWaterMask:true});
 status.textContent='Native quantized-mesh terrain provider connected (Re:Earth / Mapterhorn).';
}catch(e){status.textContent='Native terrain unavailable: '+e.message+'. Smooth globe fallback.';}
// Stream tiled Overture buildings worldwide, without an account token.
let globalBuildings=null;
// Zoom-aware detail: finer nearby terrain and buildings, coarse distant tiles.
// Smooth thresholds avoid rapid switching while the camera moves.
let currentLod='';
function updateZoomLod(){
 const cart=viewer.camera.positionCartographic;
 if(!cart)return;
 const altitude=Math.max(0,cart.height);
 const next=altitude<1200?'street':altitude<12000?'near':altitude<180000?'regional':'far';
 if(next===currentLod)return;
 currentLod=next;
 const high=quality==='high';
 const terrainErrors={far:7,regional:3,near:1.6,street:1.2};
 const buildingErrors={far:24,regional:14,near:8,street:5};
 viewer.scene.globe.maximumScreenSpaceError=terrainErrors[next]*(high?.75:1);
 viewer.scene.globe.tileCacheSize=next==='street'?(high?220:130):next==='near'?140:next==='regional'?100:65;
 if(globalBuildings)globalBuildings.maximumScreenSpaceError=buildingErrors[next]*(high?.75:1);
 const lodStatus=document.getElementById('lod-status');
 if(lodStatus)lodStatus.textContent='Detail: '+next+' · adaptive terrain and buildings';
}
viewer.camera.changed.addEventListener(updateZoomLod);
document.getElementById('quality').onclick=()=>{applyQuality(quality==='high'?'balanced':'high');status.textContent=quality==='high'?'High-detail mode: finer terrain and building LOD, up to 2× display resolution. May use more battery and memory.':'Balanced mode: lower GPU and memory usage.';};
const buildingCredits=document.createElement('div');buildingCredits.style.cssText='font-size:10px;color:#b9c6d0;margin-top:5px';buildingCredits.textContent='Buildings © OpenStreetMap contributors, Overture Maps Foundation (ODbL). Terrain © Re:Earth Terrain / Mapterhorn.';document.getElementById('panel').appendChild(buildingCredits);
const globalBuildingsButton=document.getElementById('global-buildings');
globalBuildingsButton.onclick=async()=>{
 if(globalBuildings){viewer.scene.primitives.remove(globalBuildings);globalBuildings=null;globalBuildingsButton.textContent='Enable global 3D buildings';status.textContent='Global building tiles hidden.';return;}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;document.getElementById('buildings').textContent='Load nearby 3D buildings';}
 globalBuildingsButton.disabled=true;status.textContent='Connecting to worldwide 3D building tiles…';
 try{
  const tileset=await Cesium.Cesium3DTileset.fromUrl('https://buildings.reearth.land/tileset.json',{maximumScreenSpaceError:quality==='high'?8:16,dynamicScreenSpaceError:true,skipLevelOfDetail:true});
  viewer.scene.primitives.add(tileset);globalBuildings=tileset;currentLod='';updateZoomLod();
  tileset.tileFailed.addEventListener(e=>console.warn('3D building tile failed',e));
  globalBuildingsButton.textContent='Hide global 3D buildings';
  status.textContent='Worldwide Overture building geometry enabled. Zoom into a city; building tiles stream as needed. Detailed landmark models remain separate.';
 }catch(e){status.textContent='Global 3D building tiles unavailable: '+e.message+'. Nearby OSM extrusions remain available.';}
 finally{globalBuildingsButton.disabled=false;}
};
// Distinctive architectural geometry prototype for the Seattle Space Needle.
// This is hand-built simplified geometry, NOT a surveyed/photogrammetric asset.
let needleEntities=[];
const needleButton=document.getElementById('needle-model');
needleButton.onclick=async()=>{
 if(needleEntities.length){
  needleEntities.forEach(e=>viewer.entities.remove(e));needleEntities=[];
  needleButton.textContent='Show Space Needle 3D prototype';
  status.textContent='Space Needle prototype hidden.';
  return;
 }
 needleButton.disabled=true;
 try{
  const lon=-122.3493,lat=47.6205;
  let ground=0;
  if(terrainEnabled&&terrainProvider){
   try{const sample=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[Cesium.Cartographic.fromDegrees(lon,lat)]);ground=Number.isFinite(sample[0]?.height)?sample[0].height:0;}catch(e){console.warn('Needle elevation sample unavailable',e);}
  }
  const p=(east,north,up)=>{
   const center=Cesium.Cartesian3.fromDegrees(lon,lat,ground);
   const transform=Cesium.Transforms.eastNorthUpToFixedFrame(center);
   return Cesium.Matrix4.multiplyByPoint(transform,new Cesium.Cartesian3(east,north,up),new Cesium.Cartesian3());
  };
  const silver=Cesium.Color.fromCssColorString('#c3cbd1'),dark=Cesium.Color.fromCssColorString('#596b7a'),glass=Cesium.Color.fromCssColorString('#395a70');
  const add=spec=>{const entity=viewer.entities.add(spec);needleEntities.push(entity);return entity;};
  const cylinder=(name,z,length,top,bottom,material)=>add({name,position:p(0,0,z),cylinder:{length,topRadius:top,bottomRadius:bottom,material,outline:false}});
  cylinder('Space Needle central tower',76,146,5,7,silver);
  cylinder('Space Needle observation deck glazing',157,13,29,24,glass);
  cylinder('Space Needle saucer roof',168,9,3,31,silver);
  cylinder('Space Needle lower saucer',148,8,25,9,silver);
  cylinder('Space Needle spire',190,37,.5,2,silver);
  for(let i=0;i<3;i++){
   const a=i*Math.PI*2/3,ex=Math.cos(a)*27,ny=Math.sin(a)*27;
   add({name:'Space Needle tripod leg',polyline:{positions:[p(ex,ny,2),p(ex*.65,ny*.65,65),p(ex*.19,ny*.19,147)],width:7,material:silver,clampToGround:false}});
   add({name:'Space Needle diagonal support',polyline:{positions:[p(ex,ny,9),p(-ex*.12,-ny*.12,91)],width:3,material:dark,clampToGround:false}});
  }
  updateLandmarkVisibility();
  needleButton.textContent='Hide Space Needle prototype';
  currentTarget={name:'Space Needle 3D prototype',lon,lat,type:'landmark'};
  viewer.camera.flyTo({destination:p(0,-420,240),orientation:{heading:0,pitch:Cesium.Math.toRadians(-25),roll:0},duration:2});
  status.textContent='Seattle Space Needle: simplified 3D architectural prototype at its approximate location. This is NOT a licensed high-fidelity model; detailed geometry and textures still required.';
 }catch(e){needleEntities.forEach(entity=>viewer.entities.remove(entity));needleEntities=[];status.textContent='Space Needle prototype unavailable: '+e.message;}
 finally{needleButton.disabled=false;}
};
// Reusable procedural landmark layer. Geometry is illustrative and deliberately
// separate from approved/photogrammetric assets; no invented provenance.
let wonderModels=[];
const wonderButton=document.getElementById('landmark-models');
wonderButton.onclick=async()=>{
 if(wonderModels.length){
  wonderModels.forEach(e=>viewer.entities.remove(e));wonderModels=[];
  wonderButton.textContent='Show Wonder 3D prototypes';
  status.textContent='Wonder architectural prototypes hidden.';
  return;
 }
 wonderButton.disabled=true;
 const add=spec=>{const e=viewer.entities.add(spec);wonderModels.push(e);return e;};
 try{
  const place=async(lon,lat)=>{
   let elevation=0;
   if(terrainEnabled&&terrainProvider){
    try{const v=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[Cesium.Cartographic.fromDegrees(lon,lat)]);elevation=Number.isFinite(v[0]?.height)?v[0].height:0;}catch(e){console.warn('Landmark elevation unavailable',e);}
   }
   const transform=Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(lon,lat,elevation));
   return (x,y,z)=>Cesium.Matrix4.multiplyByPoint(transform,new Cesium.Cartesian3(x,y,z),new Cesium.Cartesian3());
  };
  // Colosseum: concentric elliptical colonnades, not a surveyed mesh.
  {
   modelLon=12.49223;modelLat=41.89021;
   const p=await place(12.49223,41.89021);
   const stone=Cesium.Color.fromCssColorString('#c4ac89');
   for(const radius of [1,.78]){
    for(let i=0;i<72;i++){
     const a=2*Math.PI*i/72, x=Math.cos(a)*94*radius,y=Math.sin(a)*78*radius;
     add({name:'Colosseum illustrative arcade column',position:p(x,y,18),cylinder:{length:36,topRadius:1.8,bottomRadius:2.2,material:stone}});
    }
   }
   for(const z of [9,23,36]){
    const points=[];for(let i=0;i<=144;i++){const a=2*Math.PI*i/144;points.push(p(Math.cos(a)*94,Math.sin(a)*78,z));}
    add({name:'Colosseum illustrative ring',polyline:{positions:points,width:5,material:stone}});
   }
  }
  // Taj Mahal: symmetric base, domed central mass, and four minarets.
  {
   modelLon=78.0421;modelLat=27.1751;
   const p=await place(78.0421,27.1751);
   const ivory=Cesium.Color.fromCssColorString('#eee7da');
   add({name:'Taj Mahal illustrative plinth',position:p(0,0,4),box:{dimensions:new Cesium.Cartesian3(110,110,8),material:ivory}});
   add({name:'Taj Mahal illustrative central chamber',position:p(0,0,27),box:{dimensions:new Cesium.Cartesian3(57,57,39),material:ivory}});
   add({name:'Taj Mahal illustrative main dome',position:p(0,0,56),ellipsoid:{radii:new Cesium.Cartesian3(22,22,22),material:ivory}});
   add({name:'Taj Mahal illustrative finial',position:p(0,0,82),cylinder:{length:12,topRadius:.3,bottomRadius:1.4,material:Cesium.Color.GOLD}});
   for(const x of [-46,46])for(const y of [-46,46]){
    add({name:'Taj Mahal illustrative minaret',position:p(x,y,29),cylinder:{length:50,topRadius:2.5,bottomRadius:3.4,material:ivory}});
    add({name:'Taj Mahal illustrative minaret crown',position:p(x,y,56),ellipsoid:{radii:new Cesium.Cartesian3(4,4,4),material:ivory}});
   }
  }
  // Chichén Itzá: stepped El Castillo pyramid, simplified geometry.
  {
   modelLon=-88.56865;modelLat=20.68429;
   const p=await place(-88.56865,20.68429);
   const limestone=Cesium.Color.fromCssColorString('#b9ad8b');
   for(let level=0;level<9;level++){
    const size=55-level*5.2,step=2.8;
    add({name:'El Castillo illustrative stepped pyramid tier '+(level+1),position:p(0,0,level*step+step/2),box:{dimensions:new Cesium.Cartesian3(size,size,step),material:limestone}});
   }
   add({name:'El Castillo illustrative summit temple',position:p(0,0,28.8),box:{dimensions:new Cesium.Cartesian3(10,10,7),material:limestone}});
  }
  // Christ the Redeemer: simplified monumental statue silhouette on Corcovado.
  {
   modelLon=-43.2105;modelLat=-22.9519;
   const p=await place(-43.2105,-22.9519);
   const stone=Cesium.Color.fromCssColorString('#d4d5d1');
   add({name:'Christ the Redeemer illustrative pedestal',position:p(0,0,4),box:{dimensions:new Cesium.Cartesian3(9,9,8),material:stone}});
   add({name:'Christ the Redeemer illustrative torso',position:p(0,0,20),box:{dimensions:new Cesium.Cartesian3(9,6,24),material:stone}});
   add({name:'Christ the Redeemer illustrative outstretched arms',position:p(0,0,27),box:{dimensions:new Cesium.Cartesian3(28,4,4.5),material:stone}});
   add({name:'Christ the Redeemer illustrative head',position:p(0,0,34),ellipsoid:{radii:new Cesium.Cartesian3(3,3,4),material:stone}});
  }
  updateLandmarkVisibility();
  wonderButton.textContent='Hide Wonder 3D prototypes';
  status.textContent='Colosseum, Taj Mahal, El Castillo and Christ the Redeemer: early procedural architectural geometry at approximate coordinates. Not photorealistic, surveyed, or final CONVERGENCE models.';
 }catch(e){
  wonderModels.forEach(entity=>viewer.entities.remove(entity));wonderModels=[];
  status.textContent='Wonder prototypes unavailable: '+e.message;
 }finally{wonderButton.disabled=false;}
};
// Illustrative architectural models appear only when exploring their region.
function updateLandmarkVisibility(){
 const camera=viewer.camera.positionWC;
 const visibleWithin=120000;
 const near=(lon,lat)=>Cesium.Cartesian3.distance(camera,Cesium.Cartesian3.fromDegrees(lon,lat))<visibleWithin;
 const needleVisible=near(-122.3493,47.6205);
 for(const e of needleEntities)e.show=needleVisible;
 for(const e of wonderModels){
  const lon=e.properties?.prototypeLongitude?.getValue();
  const lat=e.properties?.prototypeLatitude?.getValue();
  if(Number.isFinite(lon)&&Number.isFinite(lat))e.show=near(lon,lat);
 }
}
viewer.camera.changed.addEventListener(updateLandmarkVisibility);
// OSM building footprints extruded into actual 3D polygon geometry; limited downtown pilot.
let buildingCollection=null;let orbitHandler=null;let currentTarget={lat:47.604,lon:-122.334,name:'Downtown Seattle'};
document.getElementById('buildings').onclick=async()=>{
 const button=document.getElementById('buildings');
 if(globalBuildings){status.textContent='Global building tiles are already active. Disable them before loading the local OSM layer to avoid duplicate buildings.';return;}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;button.textContent='Load nearby 3D buildings';status.textContent='Nearby buildings hidden.';return;}
 button.disabled=true;status.textContent='Fetching OpenStreetMap building footprints near '+currentTarget.name+'…';
 try{
  const {lat,lon}=currentTarget;const delta=.006;const bbox=[lat-delta,lon-delta,lat+delta,lon+delta].join(',');const q='[out:json][timeout:25];way["building"]('+bbox+');out geom;';
  let response;let lastError;
  for(const endpoint of ['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass-api.de/api/interpreter']){
   try{const candidate=await fetch(endpoint+'?data='+encodeURIComponent(q),{signal:AbortSignal.timeout(18000)});if(candidate.ok){response=candidate;break;}lastError=Error('HTTP '+candidate.status);}catch(e){lastError=e;}
  }
  if(!response)throw lastError||Error('All building services unavailable');
  if(!response.ok)throw Error('OpenStreetMap building service HTTP '+response.status);
  const data=await response.json();
  const features=[];
  for(const el of data.elements||[]){
   if(!el.geometry||el.geometry.length<4)continue;
   const coords=el.geometry.map(p=>[p.lon,p.lat]);
   if(coords[0][0]!==coords[coords.length-1][0]||coords[0][1]!==coords[coords.length-1][1])coords.push(coords[0]);
   const tags=el.tags||{};
   const heightText=String(tags.height||'').replace(/[^0-9.]/g,'');
   const height=heightText?Number(heightText):(Math.max(1,Number(tags['building:levels'])||3)*3.2);
   features.push({type:'Feature',properties:{name:tags.name||'Building',height:Math.min(450,Math.max(3,height)),osm_id:el.id},geometry:{type:'Polygon',coordinates:[coords]}});
  }
  const fc={type:'FeatureCollection',features};
  buildingCollection=await Cesium.GeoJsonDataSource.load(fc,{clampToGround:false});
  for(const entity of buildingCollection.entities.values){
   if(!entity.polygon)continue;
   const props=entity.properties;
   const height=props.height.getValue();
   entity.polygon.height=0;
   entity.polygon.heightReference=Cesium.HeightReference.RELATIVE_TO_GROUND;
   entity.polygon.extrudedHeight=height;
   entity.polygon.extrudedHeightReference=Cesium.HeightReference.RELATIVE_TO_GROUND;
   entity.polygon.material=Cesium.Color.fromCssColorString('#9aa7b3').withAlpha(.94);
   entity.polygon.outline=false;
   entity.polygon.shadows=Cesium.ShadowMode.DISABLED;
  }
  viewer.dataSources.add(buildingCollection);
  button.textContent='Hide nearby 3D buildings';
  status.textContent=features.length+' building footprints near '+currentTarget.name+' extruded relative to ground. Height estimates used where missing; geometry is schematic, not photogrammetry.';
  viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,2600),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:1.8});
 }catch(e){status.textContent='Building data unavailable: '+e.message+'. Try again later.';}
 finally{button.disabled=false;}
};
// Shared Atlas registry: Guild Hall/Outpost reference points and New Seven Wonders.
document.getElementById('orbit').onclick=async()=>{
 const button=document.getElementById('orbit');
 if(orbitHandler){viewer.clock.onTick.removeEventListener(orbitHandler);orbitHandler=null;button.textContent='Orbit selected site';status.textContent='Orbit stopped.';return;}
 const target=Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,0);
 try{
  const sample=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[Cesium.Cartographic.fromDegrees(currentTarget.lon,currentTarget.lat)]);
  const height=Number.isFinite(sample[0]?.height)?sample[0].height:0;
  const center=Cesium.Cartesian3.fromDegrees(currentTarget.lon,currentTarget.lat,height);
  viewer.camera.lookAt(center,new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-30),Math.max(450,currentTarget.type==='wonder'?1400:850)));
  let last=Date.now();
  orbitHandler=()=>{const now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;viewer.camera.rotateRight(dt*.08);};
  viewer.clock.onTick.addEventListener(orbitHandler);button.textContent='Stop orbit';
  status.textContent='Orbiting '+currentTarget.name+'. Buildings are OSM extrusions; detailed Guild architecture is not yet modeled.';
 }catch(e){status.textContent='Unable to start orbit: '+e.message;}
};
const destinationSelect=document.getElementById('destinations');
const destinations=[];
try{
 const [guildRes,wonderRes]=await Promise.all([fetch('data/approved-guild-registry.json'),fetch('data/modern-seven-wonders.geojson')]);
 if(!guildRes.ok||!wonderRes.ok)throw Error('Atlas registry unavailable');
 const guildData=await guildRes.json(),wonderData=await wonderRes.json();
 for(const site of guildData.sites||[]){const p=site.map_reference;if(p&&Number.isFinite(p.latitude)&&Number.isFinite(p.longitude))destinations.push({id:site.id,name:site.id+' · '+site.location,lat:p.latitude,lon:p.longitude,type:'guild',note:'Approximate site reference; approved building placement not surveyed'});}
 for(const feature of wonderData.features||[]){const c=feature.geometry?.coordinates;if(c?.length>=2)destinations.push({id:feature.properties.id,name:feature.properties.name,lat:c[1],lon:c[0],type:'wonder',note:feature.properties.note||'Landmark reference point'});}
 for(const type of ['guild','wonder']){const group=document.createElement('optgroup');group.label=type==='guild'?'Guild Halls and Outposts':'Seven Wonders';for(const d of destinations.filter(d=>d.type===type)){const o=document.createElement('option');o.value=d.id;o.textContent=d.name;group.appendChild(o);}destinationSelect.appendChild(group);}
 const markers=viewer.entities;
 for(const d of destinations){markers.add({name:d.name,position:Cesium.Cartesian3.fromDegrees(d.lon,d.lat,0),point:{pixelSize:d.type==='wonder'?10:7,color:d.type==='wonder'?Cesium.Color.GOLD:Cesium.Color.CYAN,outlineColor:Cesium.Color.BLACK,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:300000},label:{text:d.type==='wonder'?d.name:'',font:'12px sans-serif',fillColor:Cesium.Color.WHITE,pixelOffset:new Cesium.Cartesian2(0,-16),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,150000)}});}
 status.textContent='Atlas destinations ready: '+destinations.length+' Guild/Wonder reference points. Choose one to inspect.';
}catch(e){status.textContent='Destination registry failed: '+e.message;}
// Terrain-aware inspection positions: heights are relative to actual ground,
// not to the WGS84 ellipsoid. This prevents ground-level presets clipping into hills.
async function inspectAtHeight(aboveGround){
 if(orbitHandler){viewer.clock.onTick.removeEventListener(orbitHandler);orbitHandler=null;document.getElementById('orbit').textContent='Orbit selected site';viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);}
 const target=currentTarget;
 const carto=Cesium.Cartographic.fromDegrees(target.lon,target.lat);
 let ground=0;
 try{
  if(terrainEnabled&&terrainProvider){
   const samples=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[carto]);
   if(Number.isFinite(samples[0]?.height))ground=samples[0].height;
  }
 }catch(e){console.warn('Ground elevation sampling unavailable',e);}
 if(target!==currentTarget)return;
 const altitude=Math.max(ground+aboveGround,ground+20);
 const pitch=aboveGround<=100?Cesium.Math.toRadians(-16):aboveGround<=800?Cesium.Math.toRadians(-32):Cesium.Math.toRadians(-60);
 viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(target.lon,target.lat,altitude),orientation:{heading:0,pitch,roll:0},duration:1.8});
 status.textContent=target.name+' · '+Math.round(aboveGround)+' m above sampled terrain. This is a camera view, not a claim that the landmark has a finished 3D model.';
}
document.querySelectorAll('[data-inspect-height]').forEach(button=>button.onclick=()=>inspectAtHeight(Number(button.dataset.inspectHeight)));
document.getElementById('inspect').onclick=()=>{
 const d=destinations.find(x=>x.id===destinationSelect.value);if(!d){status.textContent='Choose a destination first.';return;}
 currentTarget=d;
 if(orbitHandler){viewer.clock.onTick.removeEventListener(orbitHandler);orbitHandler=null;document.getElementById('orbit').textContent='Orbit selected site';viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);}
 if(buildingCollection){viewer.dataSources.remove(buildingCollection,true);buildingCollection=null;document.getElementById('buildings').textContent='Load nearby 3D buildings';}
 inspectAtHeight(d.type==='wonder'?4500:800);
 document.getElementById('panel').classList.add('collapsed');document.getElementById('panel-toggle').setAttribute('aria-expanded','false');
 status.textContent=d.name+' · '+d.note+'. Use Load nearby 3D buildings for schematic OSM extrusions. Canon Guild Hall architecture is not modeled yet.';
};
// Adaptive imagery: global coverage remains the base; high-detail USGS aerial
// tiles fade in over the continental US as the camera approaches street level.
const imageryButton=document.getElementById('imagery');
const usgsImageryUrl='https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}';
let imageryMode='auto',usgsLayer=null;
let lastImageryAlpha=-1;
function inUsa(lon,lat){return lon>=-125&&lon<=-66&&lat>=24&&lat<=50;}
function refreshImagery(){
 const cart=viewer.camera.positionCartographic;
 const height=Math.max(0,cart.height);
 const lon=Cesium.Math.toDegrees(cart.longitude),lat=Cesium.Math.toDegrees(cart.latitude);
 const nearby=inUsa(lon,lat);
 const alpha=imageryMode==='world'?0:imageryMode==='usgs'?1:nearby?Math.max(0,Math.min(1,(120000-height)/105000)):0;
 if(alpha>.001&&!usgsLayer){
  try{
   const provider=new Cesium.UrlTemplateImageryProvider({url:usgsImageryUrl,maximumLevel:19,rectangle:Cesium.Rectangle.fromDegrees(-125,24,-66,50),credit:'USGS National Map aerial imagery'});
   usgsLayer=viewer.imageryLayers.addImageryProvider(provider);
  }catch(e){console.warn('USGS aerial imagery overlay unavailable',e);return;}
 }
 if(usgsLayer&&Math.abs(alpha-lastImageryAlpha)>.015){usgsLayer.alpha=alpha;lastImageryAlpha=alpha;}
 const detail=document.getElementById('imagery-detail');
 if(detail)detail.textContent='Imagery: '+(alpha>.9?'USGS aerial':alpha>.01?'blending USGS aerial':'world satellite')+' · zoom-dependent tiles';
}
imageryButton.onclick=()=>{
 imageryMode=imageryMode==='auto'?'world':imageryMode==='world'?'usgs':'auto';
 imageryButton.textContent='Imagery: '+({auto:'Auto',world:'World',usgs:'USGS USA'})[imageryMode];
 refreshImagery();
 status.textContent=imageryMode==='auto'?'Automatic imagery enabled: USGS aerial tiles appear over the continental USA as you zoom closer.':'Imagery preference: '+imageryMode+'. USGS only covers the continental USA.';
};
viewer.camera.changed.addEventListener(refreshImagery);
viewer.camera.moveEnd.addEventListener(()=>{refreshImagery();updateZoomLod();});
document.querySelectorAll('[data-fly]').forEach(button=>button.onclick=()=>{const [lon,lat,alt]=button.dataset.fly.split(',').map(Number);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,alt),orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0},duration:1.8});});
terrainButton.onclick=()=>{
 terrainEnabled=!terrainEnabled;
 viewer.terrainProvider=terrainEnabled&&terrainProvider?terrainProvider:new Cesium.EllipsoidTerrainProvider();
 terrainButton.textContent=terrainEnabled?'Disable 3D terrain':'Enable 3D terrain';
 status.textContent=terrainEnabled?(terrainProvider?'Native quantized-mesh terrain enabled. Zoom toward Seattle or Rainier.':'Terrain provider unavailable; smooth globe fallback.'):'Smooth globe restored.';
};
if(terrainProvider)terrainButton.click();
applyQuality('high');
refreshImagery();
// Default to real 3D city geometry: users should not need to discover an extra switch.
globalBuildingsButton.click();
// Illustrative landmarks load automatically; individual toggles stay hidden.
needleButton.click();
wonderButton.click();
// Tap a 3D building to inspect its Overture metadata where present.
const picking=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
picking.setInputAction(event=>{
 const picked=viewer.scene.pick(event.position);
 if(!Cesium.defined(picked)||typeof picked.getProperty!=='function')return;
 const read=k=>{try{return picked.getProperty(k);}catch(e){return undefined;}};
 const name=read('name')||'3D building',height=read('height'),method=read('height_method'),floors=read('num_floors');
 status.textContent=name+(Number.isFinite(Number(height))?' · '+Number(height).toFixed(1)+' m high':'')+(floors?' · '+floors+' floors':'')+(method?' · height source: '+method:'')+'. Source: Overture Maps; heights may be estimated.';
},Cesium.ScreenSpaceEventType.LEFT_CLICK);

}catch(e){status.textContent='Unable to initialize 3D globe: '+e.message;}})();
</script></body></html>
