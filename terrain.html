<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGENCE · World Elevation</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>html,body,#map{margin:0;height:100%;width:100%;font-family:system-ui;background:#122538}#ui{position:absolute;top:10px;left:10px;right:10px;max-width:380px;z-index:3;background:#0a1b2eea;color:#f4f0e7;padding:12px;border:1px solid #b6a16e;border-radius:10px;box-sizing:border-box}a{color:#f2d58c}button{padding:9px;background:#23455d;color:white;border:1px solid #819ba7;border-radius:7px;margin:5px 4px 0 0}#coords{display:flex;gap:5px;margin-top:7px}#coords input{width:42%;min-width:0;padding:8px;background:#122e44;color:white;border:1px solid #819ba7;border-radius:6px}#coords button{margin:0}#status{font-size:12px;margin-top:7px;line-height:1.4}.maplibregl-ctrl-bottom-right{bottom:4px}</style></head><body><div id="map"></div><div id="ui"><b>CONVERGENCE · World Elevation</b><div style="font-size:13px;margin:5px 0">Worldwide terrain from public AWS Terrarium elevation tiles. <a href="globe.html">3D globe</a> · <a href="index.html">Earth Atlas</a></div><button id="seattle">Seattle</button><button id="rainier">Mount Rainier</button><button id="olympics">Olympics</button><button id="toggle">Turn terrain off</button><button id="earth">Whole Earth</button><button id="alps">Alps</button><button id="himalaya">Himalaya</button><button id="andes">Andes</button><button id="africa">Kilimanjaro</button><button id="rockies">Rockies</button><button id="japan">Mount Fuji</button><div id="coords"><input id="lat" inputmode="decimal" placeholder="Latitude" aria-label="Latitude"><input id="lon" inputmode="decimal" placeholder="Longitude" aria-label="Longitude"><button id="visit">Go</button></div><div id="status">Loading elevation map…</div><div id="elevation" style="font-size:12px;margin-top:5px;color:#e9d399">Tap the map to inspect ground elevation.</div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
(function(){const status=document.getElementById('status');if(!window.maplibregl){status.textContent='Map engine failed to load.';return;}let elevated=true;let marker=null;const elevationLabel=document.getElementById('elevation');const style={version:8,sources:{satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery: Esri and contributors'},elevation:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Elevation: Mapzen/AWS terrain tiles (Terrarium)'}},layers:[{id:'satellite',type:'raster',source:'satellite'},{id:'relief',type:'hillshade',source:'elevation',paint:{'hillshade-exaggeration':.5}}],terrain:{source:'elevation',exaggeration:1.5}};try{const map=new maplibregl.Map({container:'map',style,center:[-121.8,47.3],zoom:8,pitch:70,bearing:-15,maxPitch:85,antialias:true});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');map.on('load',()=>{status.textContent='Worldwide elevation-enabled terrain view loaded. Tilt or rotate with two fingers. Terrain is streamed from public elevation tiles; no DEM files have been imported into the game project.'});map.on('error',e=>{status.textContent='A map resource failed to load: '+(e.error?.message||'check network access')});function go(center,zoom){map.flyTo({center,zoom,pitch:70,bearing:-20,duration:1500})}document.getElementById('seattle').onclick=()=>go([-122.3321,47.6062],11);document.getElementById('rainier').onclick=()=>go([-121.7603,46.8523],11);document.getElementById('olympics').onclick=()=>go([-123.5,47.8],10);document.getElementById('earth').onclick=()=>map.flyTo({center:[0,15],zoom:1.5,pitch:0,bearing:0,duration:1600});document.getElementById('alps').onclick=()=>go([8.55,46.85],9);document.getElementById('himalaya').onclick=()=>go([86.925,27.988],9);document.getElementById('andes').onclick=()=>go([-70.01,-32.65],9);document.getElementById('africa').onclick=()=>go([37.3556,-3.0674],10);document.getElementById('rockies').onclick=()=>go([-105.64,40.25],10);document.getElementById('japan').onclick=()=>go([138.7274,35.3606],10);function inspect(lngLat){const lng=lngLat.lng,lat=lngLat.lat;if(marker)marker.remove();marker=new maplibregl.Marker({color:'#ffcf70'}).setLngLat([lng,lat]).addTo(map);const h=map.queryTerrainElevation([lng,lat],{exaggerated:false});elevationLabel.textContent='Location '+lat.toFixed(5)+', '+lng.toFixed(5)+' · '+(Number.isFinite(h)?'ground elevation approx. '+Math.round(h)+' m above sea level':'elevation loading; try again after terrain tiles load');document.getElementById('lat').value=lat.toFixed(5);document.getElementById('lon').value=lng.toFixed(5);}map.on('click',e=>inspect(e.lngLat));document.getElementById('visit').onclick=()=>{const lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat>85||lat< -85||lon>180||lon< -180){elevationLabel.textContent='Enter valid latitude (-85 to 85) and longitude (-180 to 180).';return;}go([lon,lat],10);setTimeout(()=>inspect({lng:lon,lat}),1800);};document.getElementById('toggle').onclick=()=>{elevated=!elevated;map.setTerrain(elevated?{source:'elevation',exaggeration:1.5}:null);document.getElementById('toggle').textContent=elevated?'Turn terrain off':'Turn terrain on';status.textContent=elevated?'3D terrain enabled. Elevation is streamed, not locally imported.':'3D terrain disabled; satellite map remains available.'};}catch(e){status.textContent='Unable to start elevation map: '+e.message}})();
</script></body></html>
